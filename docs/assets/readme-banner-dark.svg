<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 176" role="img" aria-labelledby="title desc">
  <title id="title">sUAS Intelligent Mission Planner</title>
  <desc id="desc">Advisory only, not a clearance. Operational mode is unreachable. The language model writes prose; the calculator writes every number.</desc>
  <rect width="800" height="176" fill="#0B0E12"/>
  <rect x="0.5" y="0.5" width="799" height="175" fill="none" stroke="#2D3643" stroke-width="1"/>
  <rect x="0" y="0" width="4" height="176" fill="#E3A008"/>
  <rect x="4" y="0" width="796" height="28" fill="#171D25"/>
  <line x1="4" y1="28" x2="800" y2="28" stroke="#2D3643" stroke-width="1"/>
  <text x="20" y="19" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.2" fill="#8992A0">sUAS MISSION PLANNER</text>
  <text x="780" y="19" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.2" fill="#E3A008" text-anchor="end">ADVISORY ONLY</text>
  <text x="20" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#E3E7ED">sUAS Intelligent Mission Planner</text>
  <text x="20" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#A1AAB8">Deterministic energy and performance feasibility. The calculator writes every number.</text>
  <text x="20" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="0.6" fill="#E3A008">ADVISORY ONLY</text>
  <text x="148" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8992A0">·  not a clearance  ·  operational mode unreachable</text>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check suas tests alembic

      - name: Ruff format check
        run: ruff format --check suas tests

      - name: Mypy strict
        run: mypy suas

      - name: Pytest with coverage
        run: pytest -q --cov=suas --cov-report=term-missing --cov-fail-under=80

      - name: Verify migrations apply and match models
        env:
          SUAS_DATABASE_URL: sqlite+aiosqlite:///./ci_check.db
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  postgres-integration:
    name: Postgres integration (py3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suas
          POSTGRES_PASSWORD: suas
          POSTGRES_DB: suas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suas -d suas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply migrations against Postgres
        env:
          SUAS_DATABASE_URL: postgresql+psycopg://suas:suas@localhost:5432/suas
        run: |
          alembic upgrade head
          alembic check
      - name: Smoke test app against Postgres
        env:
          SUAS_DATABASE_URL: postgresql+psycopg://suas:suas@localhost:5432/suas
        run: python scripts/smoke_check.py

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Capture runtime dependencies only, and do it BEFORE pip-audit is
      # installed so its own tooling does not pollute the audit set.
      #
      # The local project is excluded deliberately: suas-mission-planner is not
      # published to PyPI, and --strict fails on any dependency it cannot
      # resolve. --skip-editable does not help, because --strict also fails on
      # packages that were skipped.
      - name: Capture runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip freeze --exclude suas-mission-planner > "${RUNNER_TEMP}/requirements-runtime.txt"

      - name: Audit runtime dependencies
        run: |
          pip install pip-audit
          pip-audit --strict -r "${RUNNER_TEMP}/requirements-runtime.txt"

      # Dev tooling never reaches production, so advisories here are
      # informational and must not block a release. Read the step log when it
      # reports findings and upgrade on your own schedule.
      - name: Audit dev dependencies (advisory)
        continue-on-error: true
        run: |
          pip install ".[dev]"
          pip freeze --exclude suas-mission-planner > "${RUNNER_TEMP}/requirements-dev.txt"
          pip-audit --strict -r "${RUNNER_TEMP}/requirements-dev.txt"

  frontend:
    name: Frontend (tsc, eslint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

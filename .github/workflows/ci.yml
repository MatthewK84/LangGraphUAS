name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check suas tests alembic scripts ../eval

      - name: Ruff format check
        run: ruff format --check suas tests scripts ../eval

      - name: Mypy strict
        run: mypy suas

      - name: Pytest with coverage
        run: pytest -q --cov=suas --cov-report=term-missing --cov-fail-under=80

      - name: Verify migrations apply and match models
        env:
          SUAS_DATABASE_URL: sqlite+aiosqlite:///./ci_check.db
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  postgres-integration:
    name: Postgres integration (py3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suas
          POSTGRES_PASSWORD: suas
          POSTGRES_DB: suas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suas -d suas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply migrations against Postgres
        env:
          SUAS_DATABASE_URL: postgresql+psycopg://suas:suas@localhost:5432/suas
        run: |
          alembic upgrade head
          alembic check
      - name: Smoke test app against Postgres
        env:
          SUAS_DATABASE_URL: postgresql+psycopg://suas:suas@localhost:5432/suas
        run: python scripts/smoke_check.py

  calculator-version:
    name: Calculator version bump
    # Pull requests only: the check compares the head against the base branch,
    # which has no meaning on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the gate diffs against the merge base, which a shallow
          # clone does not contain.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - name: Require a version bump when the oracle changes
        run: >-
          python3 backend/scripts/check_calculator_version.py
          --base "origin/${{ github.base_ref }}"

  ub-mode-report:
    name: ub-mode report (crapper, dryer; non-blocking)
    # Report-only. The thresholds come from docs/skills/ub-mode/SKILL.md
    # (CRAP < 10, duplication < 0.8), but main does not meet them yet, so this
    # job never blocks a merge. See "Aspirational" in docs/engineering-practices.md.
    runs-on: ubuntu-latest
    continue-on-error: true
    # Third-party code runs here; it gets a read-only token and no secrets.
    permissions:
      contents: read
    env:
      # Neither tool publishes releases, so both are pinned to a commit.
      CRAPPER_REF: 6fd92c4c9bcc56efb64a2f8743d5a2993bcfd42d
      DRYER_REF: 66ff6d21a42c04afcad89c78a80066176d1294b0
      TREE_SITTER_VERSION: "0.26.0"
      TREE_SITTER_LANGUAGE_PACK_VERSION: "1.22.1"
    defaults:
      run:
        # Explicit bash adds pipefail, so a crashing tool is not hidden by tee.
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install crapper and dryer in their own venv
        run: |
          python -m venv "$RUNNER_TEMP/ub-tools"
          "$RUNNER_TEMP/ub-tools/bin/pip" install \
            "crapper @ git+https://github.com/unclebob/crapper@${CRAPPER_REF}" \
            "dryer @ git+https://github.com/unclebob/dryer@${DRYER_REF}" \
            "tree-sitter==${TREE_SITTER_VERSION}" \
            "tree-sitter-language-pack==${TREE_SITTER_LANGUAGE_PACK_VERSION}"
      - name: Coverage for crapper
        run: pytest -q --cov=suas --cov-report=lcov:coverage/lcov.info
      - name: Crapper on suas
        run: |
          "$RUNNER_TEMP/ub-tools/bin/crapper" --use-existing-coverage suas \
            | tee "$RUNNER_TEMP/crap.txt"
      - name: Dryer on suas
        run: |
          "$RUNNER_TEMP/ub-tools/bin/dryer" --threshold 0.8 suas \
            | tee "$RUNNER_TEMP/dry.txt"
      - name: Gate on CRAP < 10 and unlisted duplication < 0.8
        run: >-
          python scripts/ub_gate.py
          --crap "$RUNNER_TEMP/crap.txt"
          --dry "$RUNNER_TEMP/dry.txt"
          --allowlist ub-mode-allowlist.txt
      - name: Job summary
        if: always()
        run: |
          crap="$RUNNER_TEMP/crap.txt"
          dry="$RUNNER_TEMP/dry.txt"
          touch "$crap" "$dry"
          over=$(awk '$NF ~ /^[0-9.]+$/ && $NF + 0 >= 10' "$crap" | wc -l)
          total=$(awk '$NF ~ /^[0-9.]+$/' "$crap" | wc -l)
          pairs=$(grep -c '^DUPLICATE' "$dry" || true)
          {
            echo "## ub-mode report (non-blocking)"
            echo
            echo "Thresholds from \`docs/skills/ub-mode/SKILL.md\`: CRAP < 10, duplication < 0.8."
            echo "crapper \`${CRAPPER_REF}\`, dryer \`${DRYER_REF}\`."
            echo
            echo "- Functions at CRAP >= 10: **${over}** of ${total}"
            echo "- Duplicate pairs at >= 0.8: **${pairs}**"
            echo
            echo "<details><summary>crapper output</summary>"
            echo
            echo '```'
            cat "$crap"
            echo '```'
            echo "</details>"
            echo
            echo "<details><summary>dryer output</summary>"
            echo
            echo '```'
            cat "$dry"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (tsc, eslint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

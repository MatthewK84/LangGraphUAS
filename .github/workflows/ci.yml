name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job gets a read-only token unless it asks for more. No job here does.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check suas tests alembic scripts ../eval

      - name: Ruff format check
        run: ruff format --check suas tests scripts ../eval

      - name: Mypy strict
        run: mypy suas

      - name: Pytest with coverage
        run: pytest -q --cov=suas --cov-report=term-missing --cov-fail-under=80

      - name: Verify migrations apply and match models
        env:
          SUAS_DATABASE_URL: sqlite+aiosqlite:///./ci_check.db
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  postgres-integration:
    name: Postgres integration (py3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suas
          POSTGRES_PASSWORD: suas
          POSTGRES_DB: suas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suas -d suas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply migrations against Postgres
        env:
          SUAS_DATABASE_URL: postgresql+psycopg://suas:suas@localhost:5432/suas
        run: |
          alembic upgrade head
          alembic check
      - name: Smoke test app against Postgres
        env:
          SUAS_DATABASE_URL: postgresql+psycopg://suas:suas@localhost:5432/suas
        run: python scripts/smoke_check.py
      # The other direction (#111): a database alembic never touched must
      # make /ready answer 503 with migrations "pending", even though the
      # lifespan's create_all gives it every table.
      - name: Smoke test /ready refuses an unmigrated database
        env:
          SUAS_DATABASE_URL: postgresql+psycopg://suas:suas@localhost:5432/suas_unmigrated
        run: |
          python -c "import psycopg; psycopg.connect('postgresql://suas:suas@localhost:5432/suas', autocommit=True).execute('CREATE DATABASE suas_unmigrated')"
          python scripts/smoke_check.py --expect-unmigrated
      # Two workers seed at startup; on an empty database they used to race
      # to INSERT and one died on the primary key (main run 40237537525).
      - name: Concurrent startup on a fresh database
        env:
          SUAS_TEST_POSTGRES_URL: postgresql://suas:suas@localhost:5432/suas
        run: python -m pytest -q -p no:cacheprovider tests/test_startup_concurrency.py
      # Two workers, one rate-limit ceiling (#84): the race needs Postgres row
      # locks, which SQLite's single writer cannot exercise.
      - name: Shared rate limit on Postgres
        env:
          SUAS_TEST_POSTGRES_URL: postgresql://suas:suas@localhost:5432/suas
        run: python -m pytest -q -p no:cacheprovider tests/test_shared_rate_limit.py tests/test_retired_keys.py tests/test_sliding_window_limiter.py tests/test_shared_weather_cache.py tests/test_housekeeping.py tests/test_weather_stale_max_age.py tests/test_deploy_migrations.py tests/test_backup_restore.py

  calculator-version:
    name: Calculator version bump
    # Pull requests only: the check compares the head against the base branch,
    # which has no meaning on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the gate diffs against the merge base, which a shallow
          # clone does not contain.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The base ref reaches the shell through env, never through template
      # expansion, so a branch name cannot inject shell syntax.
      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"
      - name: Require a version bump when the oracle changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          python3 backend/scripts/check_calculator_version.py
          --base "origin/$BASE_REF"

  ub-mode:
    name: ub-mode (crapper, dryer)
    # Blocking. Thresholds from docs/skills/ub-mode/SKILL.md: every function in
    # backend/suas at CRAP < 10, and no duplicate pair at dryer score >= 0.8
    # unless it is listed with a reason in backend/ub-mode-allowlist.txt.
    # See "CI gates that block merge" in docs/engineering-practices.md.
    runs-on: ubuntu-latest
    # Third-party code runs here; it gets a read-only token and no secrets.
    permissions:
      contents: read
    env:
      # Neither tool publishes releases, so both are pinned to a commit.
      CRAPPER_REF: 6fd92c4c9bcc56efb64a2f8743d5a2993bcfd42d
      DRYER_REF: 66ff6d21a42c04afcad89c78a80066176d1294b0
      TREE_SITTER_VERSION: "0.26.0"
      TREE_SITTER_LANGUAGE_PACK_VERSION: "1.22.1"
    defaults:
      run:
        # Explicit bash adds pipefail, so a crashing tool is not hidden by tee.
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install crapper and dryer in their own venv
        run: |
          python -m venv "$RUNNER_TEMP/ub-tools"
          "$RUNNER_TEMP/ub-tools/bin/pip" install \
            "crapper @ git+https://github.com/unclebob/crapper@${CRAPPER_REF}" \
            "dryer @ git+https://github.com/unclebob/dryer@${DRYER_REF}" \
            "tree-sitter==${TREE_SITTER_VERSION}" \
            "tree-sitter-language-pack==${TREE_SITTER_LANGUAGE_PACK_VERSION}"
      - name: Coverage for crapper
        run: pytest -q --cov=suas --cov-report=lcov:coverage/lcov.info
      - name: Crapper on suas
        run: |
          "$RUNNER_TEMP/ub-tools/bin/crapper" --use-existing-coverage suas \
            | tee "$RUNNER_TEMP/crap.txt"
      - name: Dryer on suas
        run: |
          "$RUNNER_TEMP/ub-tools/bin/dryer" --threshold 0.8 suas \
            | tee "$RUNNER_TEMP/dry.txt"
      - name: Gate on CRAP < 10 and unlisted duplication < 0.8
        run: >-
          python scripts/ub_gate.py
          --crap "$RUNNER_TEMP/crap.txt"
          --dry "$RUNNER_TEMP/dry.txt"
          --allowlist ub-mode-allowlist.txt
      - name: Job summary
        if: always()
        run: |
          crap="$RUNNER_TEMP/crap.txt"
          dry="$RUNNER_TEMP/dry.txt"
          touch "$crap" "$dry"
          over=$(awk '$NF ~ /^[0-9.]+$/ && $NF + 0 >= 10' "$crap" | wc -l)
          total=$(awk '$NF ~ /^[0-9.]+$/' "$crap" | wc -l)
          pairs=$(grep -c '^DUPLICATE' "$dry" || true)
          {
            echo "## ub-mode (blocking)"
            echo
            echo "Thresholds from \`docs/skills/ub-mode/SKILL.md\`: CRAP < 10, duplication < 0.8."
            echo "crapper \`${CRAPPER_REF}\`, dryer \`${DRYER_REF}\`."
            echo
            echo "- Functions at CRAP >= 10: **${over}** of ${total}"
            echo "- Duplicate pairs at >= 0.8: **${pairs}** (each must be in \`backend/ub-mode-allowlist.txt\`)"
            echo
            echo "<details><summary>crapper output</summary>"
            echo
            echo '```'
            cat "$crap"
            echo '```'
            echo "</details>"
            echo
            echo "<details><summary>dryer output</summary>"
            echo
            echo '```'
            cat "$dry"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  mutation:
    name: Mutation (mutator, report-only)
    # Report-only: survivors are listed in the job summary and never fail the
    # job. On a pull request it mutates the backend/suas modules the PR
    # changed; on a push to main, the safety core (calculators, seal,
    # screener). See "Mutation report" in docs/engineering-practices.md.
    runs-on: ubuntu-latest
    # Third-party code runs here; it gets a read-only token and no secrets.
    permissions:
      contents: read
    env:
      # mutator publishes no releases, so it is pinned to a commit. It imports
      # crapper for function names; keep CRAPPER_REF equal to the ub-mode job's.
      MUTATOR_REF: a5a0cb803b66e0cdb8bf471b3b08af701d424a41
      CRAPPER_REF: 6fd92c4c9bcc56efb64a2f8743d5a2993bcfd42d
      TREE_SITTER_VERSION: "0.26.0"
      TREE_SITTER_LANGUAGE_PACK_VERSION: "1.22.1"
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: a pull request is diffed against its merge base.
          fetch-depth: 0
      - name: Choose files to mutate
        id: targets
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.txt"
            python3 scripts/mutation_targets.py --changed "$RUNNER_TEMP/changed.txt" \
              > "$RUNNER_TEMP/targets.txt"
          else
            python3 scripts/mutation_targets.py > "$RUNNER_TEMP/targets.txt"
          fi
          cat "$RUNNER_TEMP/targets.txt"
          if [ -s "$RUNNER_TEMP/targets.txt" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.targets.outputs.any == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and mutator
        if: steps.targets.outputs.any == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m venv "$RUNNER_TEMP/mutator"
          "$RUNNER_TEMP/mutator/bin/pip" install \
            "mutator @ git+https://github.com/unclebob/mutator@${MUTATOR_REF}" \
            "crapper @ git+https://github.com/unclebob/crapper@${CRAPPER_REF}" \
            "tree-sitter==${TREE_SITTER_VERSION}" \
            "tree-sitter-language-pack==${TREE_SITTER_LANGUAGE_PACK_VERSION}"
      - name: Coverage for mutator
        if: steps.targets.outputs.any == 'true'
        run: pytest -q --cov=suas --cov-report=lcov:coverage/lcov.info
      - name: Mutator
        if: steps.targets.outputs.any == 'true'
        id: mutate
        timeout-minutes: 20
        # Report-only for survivors, not for a broken tool. mutator exits 0 when
        # every mutant is killed and 3 when some survive; both pass. Anything
        # else (2: crapper missing, or the suite failing unmutated) fails the
        # job, so a run that mutated nothing cannot look green.
        run: |
          mapfile -t files < "$RUNNER_TEMP/targets.txt"
          code=0
          "$RUNNER_TEMP/mutator/bin/mutator" --use-existing-coverage \
            --test-command "python -m pytest -q -x -p no:cacheprovider" "${files[@]}" \
            > "$RUNNER_TEMP/mutate.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/mutate.txt"
          echo "mutator exit code: $code"
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ]
      - name: Job summary
        if: always()
        env:
          OUTCOME: ${{ steps.mutate.outcome }}
        run: |
          report="$RUNNER_TEMP/mutate.txt"
          touch "$report" "$RUNNER_TEMP/targets.txt"
          {
            echo "## Mutation (report-only)"
            echo
            echo "mutator \`${MUTATOR_REF}\`. Survivors do not fail this job."
            echo
            if [ ! -s "$RUNNER_TEMP/targets.txt" ]; then
              echo "No \`backend/suas\` module changed; nothing to mutate."
            else
              echo "Mutator step: **${OUTCOME}**."
              echo
              echo "- Files: $(paste -sd ' ' "$RUNNER_TEMP/targets.txt")"
              echo "- $(grep '^Total' "$report" || echo 'Total: not reported')"
              echo "- Survived: **$(grep -c '^SURVIVED' "$report" || true)**"
              echo
              echo '```'
              grep -E '^(SURVIVED|UNCOVERED)' "$report" || echo "No survivors."
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (tsc, eslint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: UI standard scan
        # Banned template patterns and literal colors (docs/ui-standard.md).
        run: npm run lint:ui
      - name: Format check
        run: npm run format
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images build
    # Builds both images, then scans them with trivy. The scan is report-only:
    # HIGH and CRITICAL findings that have a fix go to the job summary, and the
    # job stays green. The frontend's `next` needs a major bump (#100), so a
    # blocking scan would be red from day one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: suas-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: false
          load: true
          tags: suas-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install trivy
        run: scripts/install-trivy.sh "$RUNNER_TEMP"
      - name: Image scan (trivy, report-only)
        run: |
          scan() {
            {
              echo "### trivy: $1 (HIGH, CRITICAL, fix available)"
              echo '```'
              "$RUNNER_TEMP/trivy" image --quiet --cache-dir "$RUNNER_TEMP/trivy-cache" \
                --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
                --format table --exit-code 0 "$1"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          }
          scan suas-backend:ci
          scan suas-frontend:ci

  workflow-lint:
    name: Workflow lint (actionlint, zizmor)
    # Blocking. actionlint catches workflow syntax and expression mistakes;
    # zizmor catches workflow security mistakes: unpinned actions, template
    # injection, persisted credentials, broad permissions, Dependabot without
    # a cooldown. Both are pinned PyPI releases installed into their own venv,
    # and run offline: they read .github/ and nothing else.
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_PY_VERSION: "1.7.12.25"
      ZIZMOR_VERSION: "1.31.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install actionlint and zizmor in their own venv
        run: |
          python -m venv "$RUNNER_TEMP/wf-tools"
          "$RUNNER_TEMP/wf-tools/bin/pip" install \
            "actionlint-py==${ACTIONLINT_PY_VERSION}" \
            "zizmor==${ZIZMOR_VERSION}"
      - name: actionlint
        run: '"$RUNNER_TEMP/wf-tools/bin/actionlint" -color'
      - name: zizmor
        run: '"$RUNNER_TEMP/wf-tools/bin/zizmor" --offline --format github .github/'

  secrets-scan:
    name: Secret scan (gitleaks)
    # Blocking. Scans every commit reachable from the checkout, so a key that
    # was committed and then deleted still fails. The binary is a pinned
    # release, verified against its published SHA-256 before it runs.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks over the full history
        run: '"$RUNNER_TEMP/gitleaks" git . --no-banner --redact --verbose'
